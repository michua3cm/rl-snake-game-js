<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png+xml" href="/icon.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="/src/styles/main.css" id="main-style">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game RL</title>
  <script>
    (function () {
      var p = localStorage.getItem('theme-pref') || 'system';
      var t = p === 'dark' ? 'night'
            : p === 'light' ? 'light'
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
